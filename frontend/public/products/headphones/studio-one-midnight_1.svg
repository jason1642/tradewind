<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 966 1090" width="966" height="1090" role="img" aria-label="Studio One headphones in midnight" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="band" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#656b6d"/>
      <stop offset="1" stop-color="#1f2325"/>
    </linearGradient>
    <linearGradient id="shell" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#5f6567"/>
      <stop offset="1" stop-color="#23272a"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a7072"/>
      <stop offset="1" stop-color="#454a4c"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b4a42"/>
      <stop offset="1" stop-color="#403f38"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="966" height="1090" fill="#e8e8de"/>
  <circle cx="486" cy="545" r="330" fill="url(#glow)"/>
  <circle cx="486" cy="545" r="175" fill="none" stroke="#f6f5ee" stroke-width="1.6"/>
  <circle cx="486" cy="545" r="245" fill="none" stroke="#f3f2ea" stroke-width="1.6"/>
  <circle cx="486" cy="545" r="318" fill="none" stroke="#dcdbcc" stroke-width="1.4"/>
  <circle cx="486" cy="560" r="412" fill="none" stroke="#d9d8c8" stroke-width="1.4"/>
  <circle cx="486" cy="560" r="505" fill="none" stroke="#d9d8c8" stroke-width="1.4"/>

  <!-- ground shadow -->
  <ellipse cx="486" cy="815" rx="285" ry="46" fill="#a9ab9c" opacity="0.55" filter="url(#soft)"/>

  <!-- headband: trim ring, then inset band -->
  <path fill-rule="evenodd" fill="#77756d"
        d="M228,590 Q198,590 198,560 L198,469 A287,287 0 0 1 772,469 L772,560 Q772,590 742,590 Z
           M277,590 L277,484 A209,209 0 0 1 695,484 L695,590 Z"/>
  <path fill-rule="evenodd" fill="url(#band)"
        d="M247,590 Q223,590 223,566 L223,469 A262,262 0 0 1 747,469 L747,566 Q747,590 723,590 Z
           M289,590 L289,484 A197,197 0 0 1 683,484 L683,590 Z"/>
  <path d="M405,254 Q486,222 566,254" fill="none" stroke="#a7aeb1" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- sliders -->
  <rect x="295" y="476" width="29" height="120" rx="14" fill="#77756d"/>
  <rect x="299" y="480" width="21" height="116" rx="10" fill="url(#stem)"/>
  <rect x="649" y="476" width="29" height="120" rx="14" fill="#77756d"/>
  <rect x="653" y="480" width="21" height="116" rx="10" fill="url(#stem)"/>

  <!-- earcups -->
  
  <g transform="translate(282 670) rotate(4)">
    <rect x="-90" y="-125" width="180" height="250" rx="82" fill="#77756d"/>
    <rect x="-80" y="-115" width="160" height="230" rx="74" fill="url(#shell)"/>
    <rect x="-62" y="-97" width="124" height="194" rx="58" fill="#2b2b29"/>
    <rect x="-53" y="-88" width="106" height="176" rx="50" fill="url(#pad)"/>
    <path d="M-68,-70 Q-64,-94 -40,-106" fill="none" stroke="#a7aeb1" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  </g>
  
  <g transform="translate(690 668) rotate(-4)">
    <rect x="-90" y="-125" width="180" height="250" rx="82" fill="#77756d"/>
    <rect x="-80" y="-115" width="160" height="230" rx="74" fill="url(#shell)"/>
    <rect x="-62" y="-97" width="124" height="194" rx="58" fill="#2b2b29"/>
    <rect x="-53" y="-88" width="106" height="176" rx="50" fill="url(#pad)"/>
    <path d="M-32,-103 Q2,-112 38,-99" fill="none" stroke="#a7aeb1" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
